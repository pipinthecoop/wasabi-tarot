[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wasabi-tarot"
version = "0.2.0"
description = "Finite, durable Slack tarot draws"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["ruff==0.14.0", "mypy==1.18.2", "build==1.3.0", "Pillow==12.3.0"]
qa = ["playwright==1.63.0", "Pillow==12.3.0"]

[tool.setuptools]
packages = ["tarot"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true

[tool.ruff]
line-length = 160
